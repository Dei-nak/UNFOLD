 <defs><filter id="unfold-goo" x="-40%" y="-70%" width="180%" height="240%" color-interpolation-filters="sRGB">

 </filter></defs>

   <defs><linearGradient id="unfold-gradient" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#17141D"/><stop offset=".53" stop-color="#44245F"/><stop offset="1" stop-color="#7542A1"/></linearGradient></defs>
